<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invizimals - Card Catalog</title>
<style>
:root {
    --inv-lime: rgb(209, 255, 81);
}

@font-face {
    font-family: 'Orbitron';
    src: url('RESOURCES/Fonts/Orbitron/Orbitron-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}
@font-face {
    font-family: 'Orbitron Bold';
    src: url('RESOURCES/Fonts/Orbitron/Orbitron-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}
@font-face {
    font-family: 'Orbitron Black';
    src: url('RESOURCES/Fonts/Orbitron/Orbitron-Black.ttf') format('truetype');
    font-weight: bolder;
    font-style: normal;
}

/* ====== Modified CSS without boxes ====== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron Black', Tahoma, Verdana, sans-serif;
}

body {
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: url('RESOURCES/cursor_default.png') 10 10, auto;
}
.background {
    padding: 20px;
    background-image: radial-gradient(circle at center, #f972fd, #bc45e3, #711fa6 60%, #521d75);
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;
}
.background::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 10px;
    z-index: 1;
    pointer-events: none;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}
header {
    text-align: center;
    margin-bottom: 20px;
    padding: 20px;
    position: relative;
}
.title {
    position: relative;
    margin-bottom: 20px;
    image-rendering: optimizeSpeed;
    max-width: 30%;
    z-index: 10;
}
h1 {
    font-size: 3rem;
    margin-bottom: 10px;
    color: var(--inv-lime);
    text-shadow: 0 0 10px rgba(76, 201, 240, 0.7);
}
.subtitle {
    position: relative;
    font-size: 1.5rem;
    color: var(--inv-lime);
    -webkit-text-stroke: 1px rgba(0, 0, 0, 0.25);
    margin-bottom: 30px;
    z-index: 10;
}

/* ====== NEW STYLES FOR SEARCH AND FILTERS ON PC ====== */
.search_filter_language_container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 40px;
    position: relative;
    z-index: 100;
}

.search_button, .filter_button {
    background: rgba(209, 255, 81, 0.8);
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
    position: relative;
}

.search_button:hover, .filter_button:hover {
    background: rgb(241, 255, 113);
    transform: scale(1.1);
}

/* Image inside the button */
.icon_button {
    width: 30px;
    height: 30px;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
}

/* PC PANELS - ABOVE */
.search_panel {
    position: absolute;
    top: 100%;
    right: 0;
    transform: translateY(10px);
    background: rgba(209, 255, 81, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 15px;
    width: 300px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 99;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    margin-top: 10px;
}

.search_panel.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.search_panel input {
    width: 100%;
    padding: 12px 15px;
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.25);
    color: rgba(0, 0, 0, 0.5);
    font-size: 1rem;
    outline: none;
}

.search_panel input::placeholder {
    color: rgba(0, 0, 0, 0.25);
}

.filter_panel {
    position: absolute;
    top: 100%;
    left: 0;
    transform: translateY(10px);
    background: rgba(209, 255, 81, 0.8);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 15px;
    width: 300px;
    max-height: 400px;
    overflow-y: auto;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 99;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    margin-top: 10px;
}

.filter_panel.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.filter_option {
    padding: 10px 15px;
    margin: 5px 0;
    background: rgba(255, 255, 255, 0.25);
    color: rgba(0, 0, 0, 0.5);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s;
}

.filter_option:hover {
    background: rgba(255, 255, 255, 0.85);
}

.filter_option.active {
    background: rgba(255, 255, 255, 0.85);
}

.filter_title {
    text-align: center;
    margin-bottom: 15px;
    color: rgba(0, 0, 0, 0.5);
    font-size: 1.2rem;
}

/* The language_button - the box around the language_button_slider */
.language_button {
    position: relative;
    display: inline-block;
    width: 90px;
    height: 60px;
}

/* Hide default HTML checkbox */
.language_button input {
    opacity: 0;
    width: 0;
    height: 0;
}

/* mockup language_button_slider START */
/* The language_button_slider */
.language_button_slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    box-shadow:  0 10px 25px rgba(0, 0, 0, 0.3);
    pointer-events: auto;
    -webkit-transition: .4s;
    transition: all 0.3s ease;
}

.language_button_slider:before {
    position: absolute;
    content: "EN";
    color: black;

    /* position letter inside */ 
    text-align: center;
    line-height: 46px;

    height: 48px;
    width: 48px;
    left: 6px;
    bottom: 6px;
    background-color: white;
    box-shadow:  0 10px 25px rgba(0, 0, 0, 0.3);
    -webkit-transition: .4s;
    transition: .4s;
}

.language_button_slider:hover {
    background-color: rgb(241, 255, 113);
}

input:checked + .language_button_slider {
    background-color: rgba(209, 255, 81, 0.8);
}

input:focus + .language_button_slider {
    box-shadow: 0 0 1px rgba(209, 255, 81, 0.8);
}

input:checked + .language_button_slider:before {
    content: "ES";
    -webkit-transform: translateX(26px);
    -ms-transform: translateX(26px);
    transform: translateX(26px);
}

/* Rounded language_button-sliders */
.language_button_slider.round {
    border-radius: 34px;
}

.language_button_slider.round:before {
    border-radius: 50%;
}

/* ====== EXISTING STYLES ====== */
.invizimals_grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
    flex: 1;
}
.invizimal_card {
    background: transparent;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    z-index: 10;
    transform: scale(1);
    perspective: 600px;
    transition: all 250ms ease-out;
}
.invizimal_card:hover {
    z-index: 10;
    transform: scale(1.3);

    /* custom border around the card container; border-image-slice allows its animation */
    border-image-source: url(RESOURCES/frame_test.png);
    border-image-width: 60px;
    border-image-slice: 30%;
}
.invizimal_card img {
    width: 100%;
    border-radius: 8px;
    transition: all 250ms ease-out;
}
.invizimal_card:hover img {
    box-shadow: 5px 5px 10px 10px rgba(0, 0, 0, 0.5);
    transform: scale(1.05);
}
.invizimal_card h3 {
    font-size: 1.5rem;
    margin-bottom: 5px;
    color: var(--inv-lime);
    -webkit-text-stroke: 1px rgba(0, 0, 0, 0.25);
}
.invizimal_card p {
    font-size: 0.9rem;
    color: #d0d0d0;
}
.card_modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(112, 31, 166, 0.75);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.card_content {
    background: transparent;
    width: 95%;
    height: 95%;
    display: flex;
    position: relative;
}
.card_image {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.card_image img {
    image-rendering: optimizeQuality;
    max-width: 480px;
    max-height: 100%;
    border-radius: 10px;
    
    /* Crisp outline and soft shadow */
    filter: drop-shadow(2px 0 0 rgba(0, 0, 0, 0.5)) 
          drop-shadow(-2px 0 0 rgba(0, 0, 0, 0.5)) 
          drop-shadow(0 2px 0 rgba(0, 0, 0, 0.5)) 
          drop-shadow(8px 8px 10px rgba(0, 0, 0, 0.5));
}
.card_info {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: transparent;
}
.card_info h2 {
    font-size: 3rem;
    margin-bottom: 10px;
    color: var(--inv-lime);
    -webkit-text-stroke: 1px rgba(0, 0, 0, 0.5);
    text-shadow: 0 0 15px rgba(209, 255, 82, 0.75);
}
.card_info .type {
    font-size: 1.5rem;
    margin-bottom: 25px;
    color: #d0d0d0;
}
.description {
    margin-top: 25px;
    line-height: 1.6;
    color: #f0f0f0;
    font-size: 1.2rem;
    margin-bottom: 30px;
}
.stats_ar_container {
    display: flex;
    align-items: center;
    gap: 40px;
    margin-top: 20px;
}
.stat_simple {
    text-align: center;
}
.stat_value {
    font-size: 3rem;
    color: var(--inv-lime);
    -webkit-text-stroke: 1px rgba(0, 0, 0, 0.5);
    text-shadow: 0 0 15px rgba(209, 255, 82, 0.75);
    font-weight: bold;
}
.stat_label {
    font-size: 1.2rem;
    color: #d0d0d0;
    margin-top: 5px;
}
.ar_section {
    flex: 1;
    text-align: center;
}
.ar_section h3 {
    color: #4cc9f0;
    margin-bottom: 15px;
    font-size: 1.5rem;
}
.ar_image {
    width: 100%;
    max-width: 300px;
    border-radius: 10px;
    margin-bottom: 10px;
}
.ar_note {
    color: #d0d0d0;
    font-size: 1rem;
}
.close_button {
    position: absolute;
    top: 20px;
    right: 20px;
    background: transparent;
    border: none;
    color: white;
    font-size: 2.5rem;
    width: 50px;
    height: 50px;
    cursor: pointer;
    transition: all 0.3s;
    z-index: 1001;
    display: flex;
    justify-content: center;
    align-items: center;
}
.close_button:hover {
    color: #4cc9f0;
    transform: rotate(90deg);
}

.invizimal_card:hover, .search_button:hover, .filter_button:hover, .language_button_slider:hover, .filter_option:hover, .close_button:hover {
    cursor: url('RESOURCES/pointer.png') 10 2, pointer;
}

/* Card shining effects */
.card_gleam {
    position: relative;
    overflow: visible;
    transition: transform 0.1s ease-out;
    will-change: transform, background-position;
}

.card_gleam::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 9;
    pointer-events: none;
    border-radius: 8px;
    background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.25) 30%, rgba(255, 255, 255, 0.4) 40%, rgba(255, 255, 255, 0.25) 50%, transparent 60%);
    background-size: 200% 100%;
    animation: gleam 6s linear infinite;
    mix-blend-mode: overlay;
    opacity: 0.6;
}

.card_gleam::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    background-repeat: no-repeat;
    opacity: 0.3;
    transition: opacity 0.3s ease;
}

.card_gleam:hover::after {
  opacity: 0.9;
}

@keyframes gleam {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

@keyframes twinkle {
    0%, 100% {
        opacity: 0;
        transform: scale(0);
    }
    50% {
        opacity: 1;
        transform: scale(1.2);
    }
}

/* Glowing particle effects */
.card_glints {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
    pointer-events: none;
    z-index: 11;
    opacity: 0;
    animation: twinkle 2s infinite ease-in-out;
}

.card_glints-1 {
    top: 15%;
    left: 25%;
    animation-delay: 0s;
}

.card_glints-2 {
    top: 65%;
    left: 75%;
    animation-delay: 0.5s;
}

.card_glints-3 {
    top: 35%;
    left: 15%;
    animation-delay: 1s;
}

.card_glints-4 {
    top: 85%;
    left: 45%;
    animation-delay: 1.5s;
}

.card_glints-5 {
    top: 25%;
    left: 80%;
    animation-delay: 0.2s;
}

.card_glints-6 {
    top: 55%;
    left: 35%;
    animation-delay: 0.7s;
}

.card_glints-7 {
    top: 10%;
    left: 60%;
    animation-delay: 1.2s;
}

.card_glints-8 {
    top: 75%;
    left: 10%;
    animation-delay: 1.7s;
}

.card_gleam_holo::after {
  background-image: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 30%, transparent 75%);
  mix-blend-mode: overlay;
}

/* ====== MEDIA QUERIES ====== */
@media (max-width: 768px) {
    header {
        display: flex;
        flex-direction: column;
        align-items: center;   
        justify-content: center; 
        text-align: center;     
    }

    h1 {
        font-size: 2.5rem;    
    }

    .subtitle {
        font-size: 1rem;       
    }

    .card_content {
        flex-direction: column;
        width: 95%;
        height: auto;
        max-height: 90%;
        overflow-y: auto;
    }
    .card_image, .card_info { flex: none; }
    .card_info { padding: 20px; }
    .invizimals_grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .card_info h2 { font-size: 2rem; }
    .stats_ar_container { flex-direction: column; gap: 20px; }
    .stat_value { font-size: 2.5rem; }

    #modalImage {
        max-width: 300px;
    }
    
    /* ====== MOBILE STYLES FOR SEARCH AND FILTERS ====== */
    .search_filter_language_container {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        justify-content: space-between;
        padding: 0 20px;
        margin: 0;
        pointer-events: none;
        z-index: 1000; /* Added to ensure it is above */
    }

    .search_button, .filter_button {
        pointer-events: auto;
    }

    .search_panel {
        position: fixed;
        bottom: 90px;
        right: 20px;
        left: auto;
        top: auto;
        transform: translateX(400px);
        width: calc(100% - 40px);
        max-width: 300px;
        margin-top: 0;
        pointer-events: none; /* Initially disabled */
        z-index: 999; /* Ensure that it is above the content */
    }

    .search_panel.active {
        transform: translateX(0);
        pointer-events: auto; /* Enable when active */
    }

    .filter_panel {
        position: fixed;
        bottom: 90px;
        left: 20px;
        right: auto;
        top: auto;
        transform: translateY(500px);
        width: calc(100% - 40px);
        max-width: 300px;
        margin-top: 0;
        pointer-events: none; /* Initially disabled */
        z-index: 999; /* Ensure that it is above the content */
    }

    .filter_panel.active {
        transform: translateY(0);
        pointer-events: auto; /* Enable when active */
    }
    
    /* Added: When a panel is active, disable the cards behind it. */
    .search_panel.active ~ .invizimals_grid,
    .filter_panel.active ~ .invizimals_grid {
        pointer-events: none;
    }
}

/* Tone down or disable animation if needed by user. */
@media (prefers-reduced-motion: reduce) {
  .language_button_slider, .search_button, .filter_button, .search_panel, .filter_panel, .invizimal_card, .invizimal_card img, .card_gleam, .card_glints {
    transition: none;
    animation: none;
  }
}
</style>
</head>
<body>
<div class="background">
    <div class="container">
        <header>
            <img src="RESOURCES/Invizimals.png" alt="Invizimals title" class="title">
            <p class="subtitle">Welcome to the CARD CATALOG!
                <br>Total cards recorded: <span class="total_cards"></span>
            </p>

            <!-- Search and filter controls with local images -->
            <div class="search_filter_language_container">
                <div class="filter_button_container">
                    <div class="filter_button" id="filterBtn">
                        <img src="RESOURCES/filter.png" alt="Filter" class="icon_button">
                    </div>
                    <div class="filter_panel" id="filterPanel">
                        <div class="filter_title">Filter by type/habitat</div>
                        <!-- The filter options will be generated dynamically. -->
                    </div>
                </div>

                <div class="search_button_container">
                    <div class="search_button" id="searchBtn">
                        <img src="RESOURCES/search.png" alt="Search" class="icon_button">
                    </div>
                    <div class="search_panel" id="searchPanel">
                        <input type="text" id="searchInput" placeholder="Search by name...">
                    </div>
                </div>

                <div class="language_button_container">
                    <label class="language_button">
                        <input type="checkbox">
                        <span class="language_button_slider round"></span>
                    </label>
                </div>
            </div>
        </header>

        <div class="invizimals_grid">
            <!-- Cartas se crean desde JSON -->
        </div>

        <div class="card_modal" id="cardModal">
            <button class="close_button" id="closeModal">&times;</button>
            <div class="card_content">
                <div class="card_image">
                    <img id="modalImage" src="" alt="Invizimal">
                </div>
                <div class="card_info">
                    <h2 id="modalName">Number</h2>
                    <div class="type" id="modalType">Type</div>
                    <div class="description" id="modalDescription">Description...</div>
                    <div class="stats_ar_container">
                        <div class="stat_simple">
                            <div class="stat_value" id="statValue">0 / 0</div>
                            <div class="stat_label">Total Power</div>
                        </div>
                        <div class="ar_section">
                            <h3>AR Image</h3>
                            <img id="modalAR" src="" alt="AR del Invizimal" class="ar_image">
                            <p class="ar_note">Scan with the Invizimals app</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ====== JavaScript to load data from JSON ======
const grid = document.querySelector('.invizimals_grid');
const cardModal = document.getElementById('cardModal');
const closeModal = document.getElementById('closeModal');
const modalImage = document.getElementById('modalImage');
const modalName = document.getElementById('modalName');
const modalType = document.getElementById('modalType');
const modalDescription = document.getElementById('modalDescription');
const modalAR = document.getElementById('modalAR');
const statValue = document.getElementById('statValue');

// Search and filter elements
const searchBtn = document.getElementById('searchBtn');
const filterBtn = document.getElementById('filterBtn');
const searchPanel = document.getElementById('searchPanel');
const filterPanel = document.getElementById('filterPanel');
const searchInput = document.getElementById('searchInput');

// Variables for storing data
let invizimalsData = [];
let currentFilter = 'all';

// Load JSON
fetch('invizimals.json')
    .then(res => res.json())
    .then(data => {
        // TODO: Make set a default series to load from at the start
        invizimalsData = data.series.Hidden_Challenges;

        // Display number of cards in JSON
        document.querySelector('.total_cards').innerHTML = `${invizimalsData.length}`;

        renderInvizimals(data.series.Hidden_Challenges);
        setupFilters(data.series.Hidden_Challenges);
    });

// Function for rendering the cards
function renderInvizimals(data) {
    grid.innerHTML = '';
    data.forEach(inv => {
        const card = document.createElement('div');
        card.className = 'invizimal_card';
        card.setAttribute('data-id', inv.id);
        card.innerHTML = `
            <div class="card_gleam card_gleam_holo">
                <div class="card_glints card_glints-1"></div>
                <div class="card_glints card_glints-2"></div>
                <div class="card_glints card_glints-3"></div>
                <div class="card_glints card_glints-4"></div>
                <div class="card_glints card_glints-5"></div>
                <div class="card_glints card_glints-6"></div>
                <div class="card_glints card_glints-7"></div>
                <div class="card_glints card_glints-8"></div>
                <img loading="lazy" src="${inv.image}" alt="${inv.name}">
            </div>
            <h3>${inv.name}</h3>
            <p>Type: ${inv.type}</p>
        `;
        grid.appendChild(card);

        // Click event to open modal
        card.addEventListener('click', () => {
            // Verify that there are no active panels
            if (!searchPanel.classList.contains('active') && !filterPanel.classList.contains('active')) {
                modalImage.src = inv.image2; // second image
                modalName.textContent = inv.name;
                modalType.textContent = inv.type;
                modalDescription.textContent = inv.description;
                modalAR.src = inv.arImage;
                statValue.textContent = inv.stat;
                cardModal.style.display = 'flex';
            }
        });

        // card hover effects
        card.addEventListener('mousemove', (ev) => {
            Card3D(card, ev);
        });

        card.addEventListener('mouseleave', (ev) => {
            const img = card.querySelector('img');
            img.style.setProperty("--x", "50%");
            img.style.setProperty("--y", "50%");
            img.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";

            const gleam_holo = card.querySelector('.card_gleam_holo');
            gleam_holo.style.setProperty("--x", "50%");
            gleam_holo.style.setProperty("--y", "50%");
        });
    });
}

// Card 3D effect when mouseevent
function Card3D(card, ev) {
    const img = card.querySelector('img');
    const rect = img.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    const y = ev.clientY - rect.top;
    const px = (x / rect.width) * 100;
    const py = (y / rect.height) * 100;

    img.style.setProperty("--x", `${px}%`);
    img.style.setProperty("--y", `${py}%`);

    const gleam_holo = card.querySelector('.card_gleam_holo');
    gleam_holo.style.setProperty("--x", `${px}%`);
    gleam_holo.style.setProperty("--y", `${py}%`);

    // Tilt effect
    const rx = (py - 50) / 2;
    const ry = (50 - px) / 2;

    const isReduced = window.matchMedia(`(prefers-reduced-motion: reduce)`) === true || window.matchMedia(`(prefers-reduced-motion: reduce)`).matches === true;

    if (!isReduced) {
        img.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.05, 1.05, 1.05)`;
    }
}

// Configure filters
function setupFilters(data) {
    const filterPanel = document.getElementById('filterPanel');
    
    // Obtain unique types from all type arrays
    const allTypes = data.flatMap(inv => inv.types || [inv.type]);
    const types = [...new Set(allTypes)];
    
    // Create "All" option
    const allOption = document.createElement('div');
    allOption.className = 'filter_option active';
    allOption.textContent = 'ALL';
    allOption.dataset.filter = 'all';
    filterPanel.appendChild(allOption);
    
    // Create options for each type
    types.forEach(type => {
        const option = document.createElement('div');
        option.className = 'filter_option';
        option.textContent = type;
        option.dataset.filter = type;
        filterPanel.appendChild(option);
    });
    
    // Event listeners for filters
    document.querySelectorAll('.filter_option').forEach(option => {
        option.addEventListener('click', () => {
            document.querySelectorAll('.filter_option').forEach(opt => {
                opt.classList.remove('active');
            });
            option.classList.add('active');
            currentFilter = option.dataset.filter;
            applyFilters();
            filterPanel.classList.remove('active');
        });
    });
}

// Apply filters and search
function applyFilters() {
    let filteredData = [...invizimalsData];
    if (currentFilter !== 'all') {
        filteredData = filteredData.filter(inv => {
            // Compatible with the new array types and the old individual type
            const invTypes = inv.types || [inv.type];
            return invTypes.includes(currentFilter);
        });
    }
    const searchTerm = searchInput.value.toLowerCase();
    if (searchTerm) {
        filteredData = filteredData.filter(inv => 
            inv.name.toLowerCase().includes(searchTerm)
        );
    }
    renderInvizimals(filteredData);
}

// Event listeners for search and filter controls
searchBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    searchPanel.classList.toggle('active');
    if (filterPanel.classList.contains('active')) {
        filterPanel.classList.remove('active');
    }
});

filterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    filterPanel.classList.toggle('active');
    if (searchPanel.classList.contains('active')) {
        searchPanel.classList.remove('active');
    }
});

searchInput.addEventListener('input', applyFilters);

// Close panels on click outside - PC ONLY
function handleClickOutside(e) {
    // Only apply on PC (width greater than 768px)
    if (window.innerWidth > 768) {
        const isSearchPanel = searchPanel.contains(e.target);
        const isSearchBtn = searchBtn.contains(e.target);
        const isFilterPanel = filterPanel.contains(e.target);
        const isFilterBtn = filterBtn.contains(e.target);
        
        if (!isSearchPanel && !isSearchBtn) {
            searchPanel.classList.remove('active');
        }
        if (!isFilterPanel && !isFilterBtn) {
            filterPanel.classList.remove('active');
        }
    }
}

document.addEventListener('click', handleClickOutside);

// Prevent the input from closing the panel
searchInput.addEventListener('click', (e) => {
    e.stopPropagation();
});

// Close panels by tapping outside on mobile
document.addEventListener('touchstart', (e) => {
    if (window.innerWidth <= 768) {
        const isSearchPanel = searchPanel.contains(e.target);
        const isSearchBtn = searchBtn.contains(e.target);
        const isFilterPanel = filterPanel.contains(e.target);
        const isFilterBtn = filterBtn.contains(e.target);
        
        if (!isSearchPanel && !isSearchBtn && searchPanel.classList.contains('active')) {
            searchPanel.classList.remove('active');
        }
        if (!isFilterPanel && !isFilterBtn && filterPanel.classList.contains('active')) {
            filterPanel.classList.remove('active');
        }
    }
});

closeModal.addEventListener('click', () => cardModal.style.display = 'none');
cardModal.addEventListener('click', e => {
    if (e.target === cardModal) cardModal.style.display = 'none';
});

</script>
